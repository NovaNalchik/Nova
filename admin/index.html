<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Админка Nova</title>
</head>
<body>
  <!-- Подключаем Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Явно инициализируем CMS с настройками бэкенда GitHub
    window.CMS.init({
      config: {
        backend: {
          name: 'github',
          repo: 'NovaNalchik/Nova',
          branch: 'main',
          client_id: '0v23lialb7t5E1k5g7QK',  // твой Client ID
          base_url: 'https://api.github.com',
          auth_endpoint: 'https://github.com/login/oauth/authorize'
        },
        media_folder: 'img/uploads',
        public_folder: '/img/uploads',
        collections: [
          {
            name: 'projects',
            label: 'Проекты (портфолио)',
            folder: 'data/projects',
            create: true,
            slug: '{{slug}}',
            fields: [
              { label: 'Заголовок', name: 'title', widget: 'string' },
              { label: 'Описание', name: 'description', widget: 'text' },
              { label: 'Фото', name: 'image', widget: 'image' },
              { label: 'Город', name: 'city', widget: 'string', required: false },
              { label: 'Ссылка на проект', name: 'link', widget: 'string', required: false }
            ]
          },
          {
            name: 'reviews',
            label: 'Отзывы',
            folder: 'data/reviews',
            create: true,
            slug: '{{slug}}',
            fields: [
              { label: 'Имя', name: 'name', widget: 'string' },
              { label: 'Текст отзыва', name: 'text', widget: 'text' },
              { label: 'Город', name: 'city', widget: 'string', required: false },
              { label: 'Рейтинг (1-5)', name: 'rating', widget: 'number', valueType: 'int', min: 1, max: 5, default: 5 }
            ]
          },
          {
            name: 'settings',
            label: 'Настройки сайта',
            folder: 'data/settings',
            create: false,
            files: [
              {
                name: 'general',
                label: 'Основные настройки',
                file: 'data/settings/general.json',
                fields: [
                  { label: 'Телефон', name: 'phone', widget: 'string' },
                  { label: 'Адрес', name: 'address', widget: 'string' },
                  { label: 'Ссылка Instagram', name: 'instagram', widget: 'string' }
                ]
              }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
