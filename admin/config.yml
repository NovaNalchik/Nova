backend:
  name: github
  repo: NovaNalchik/Nova
  branch: main
  client_id: 0v23lialb7t5E1k5g7QK

media_folder: "img/uploads"
public_folder: "/img/uploads"

collections:
  - name: "projects"
    label: "Проекты (портфолио)"
    files:
      - name: "projects"
        label: "Список проектов"
        file: "data/projects.json"
        fields:
          - label: "Проекты"
            name: "projects"
            widget: "list"
            fields:
              - { label: "Заголовок", name: "title", widget: "string" }
              - { label: "Описание", name: "description", widget: "text" }
              - { label: "Фото", name: "image", widget: "image" }
              - { label: "Город", name: "city", widget: "string", required: false }
              - { label: "Ссылка", name: "link", widget: "string", required: false }

  - name: "reviews"
    label: "Отзывы"
    files:
      - name: "reviews"
        label: "Список отзывов"
        file: "data/reviews.json"
        fields:
          - label: "Отзывы"
            name: "reviews"
            widget: "list"
            fields:
              - { label: "Имя", name: "name", widget: "string" }
              - { label: "Текст", name: "text", widget: "text" }
              - { label: "Город", name: "city", widget: "string", required: false }
              - { label: "Рейтинг (1-5)", name: "rating", widget: "number", valueType: "int", min: 1, max: 5, default: 5 }

  - name: "settings"
    label: "Настройки сайта"
    files:
      - name: "general"
        label: "Основные настройки"
        file: "data/settings.json"
        fields:
          - { label: "Телефон", name: "phone", widget: "string" }
          - { label: "Адрес", name: "address", widget: "string" }
          - { label: "Instagram", name: "instagram", widget: "string" }
